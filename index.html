<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ねこの水分・トイレ帳</title>
<meta name="theme-color" content="#2a7f8f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ねこ帳">
<style>
:root{
  --bg:#f5f3ef;--card:#fff;--ink:#23211e;--sub:#76716a;--line:#e4e0d8;--acc:#2a7f8f;--acc2:#e3f1f3;
  --mix:#e8954a;--bowl:#3a8bd6;--food:#9474cc;--total:#23211e;--warn:#c0392b;--warnbg:#fdecea;--ok:#2e8b57;
  --dry:#c9a15a;--wet:#d46a8a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171a;--card:#212428;--ink:#ecebe8;--sub:#a29d95;--line:#34383d;--acc:#5fb8c8;--acc2:#1f3539;
  --mix:#f0a860;--bowl:#5aa6ee;--food:#ad92e0;--total:#ecebe8;--warn:#ef6b5e;--warnbg:#3a2220;--ok:#55c08a;
  --dry:#dbb46e;--wet:#e5809f;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{max-width:45%;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:4px 10px;font-size:13px}
.daynav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.daynav .d{flex:1;text-align:center;font-weight:700;font-size:16px}
.big{font-size:28px;font-weight:800;letter-spacing:.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.kv div{background:var(--bg);border-radius:10px;padding:6px 8px}
.kv b{display:block;font-size:16px}
.kv span{font-size:12px;color:var(--sub)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qb{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;font-size:13px}
.qb .i{font-size:22px;display:block}
.qb.hot{background:var(--acc2);border-color:var(--acc)}
.list .it{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.list .it:first-child{border-top:0}
.list .tm{color:var(--sub);font-size:12px;width:54px;flex:none}
.list .bd{flex:1;min-width:0}
.list .memo{color:var(--sub);font-size:13px;white-space:pre-wrap;word-break:break-word}
.alert{background:var(--warnbg);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.alert b{color:var(--warn)}
.alert ul{margin:4px 0 4px 18px;padding:0}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--warnbg);color:var(--warn);margin-left:4px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.md h3{margin:0 0 10px;font-size:17px}
.f{margin-bottom:12px}
.f>label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.f input[type=number],.f input[type=text],.f input[type=datetime-local],.f input[type=date],.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.f textarea{min-height:80px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:14px;display:flex;align-items:center;gap:5px;background:var(--bg)}
.calc{background:var(--acc2);border-radius:10px;padding:8px 10px;font-weight:700;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.cal .c{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:68px;padding:3px;font-size:10px;line-height:1.3;cursor:pointer;overflow:hidden}
.cal .c.out{opacity:.35}
.cal .c.today{border-color:var(--acc);border-width:2px}
.cal .c .n{font-weight:700;font-size:12px}
.cal .c .w{color:var(--bowl);font-weight:700}
.cal .c .ic{font-size:10px}
.sun{color:#d0473a}.sat{color:#3a76d0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin-top:6px}
svg text{font-size:10px;fill:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;display:flex;gap:10px;align-items:center}
.toast button{background:none;border:1px solid var(--bg);color:var(--bg);border-radius:8px;padding:2px 8px;font-size:13px}
.setitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.setitem:first-of-type{border-top:0}
.setitem .grow{flex:1;min-width:0}
.sync{font-size:11px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:18px 0}
.pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<header>
  <h1>🐈 ねこの水分・トイレ帳</h1>
  <select id="catSel" onchange="pickCat(this.value)"></select>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="rec" onclick="go('rec')"><span class="i">✏️</span>記録</button>
  <button data-t="graph" onclick="go('graph')"><span class="i">📈</span>グラフ</button>
  <button data-t="cal" onclick="go('cal')"><span class="i">📅</span>カレンダー</button>
  <button data-t="rep" onclick="go('rep')"><span class="i">📋</span>レポート</button>
  <button data-t="set" onclick="go('set')"><span class="i">⚙️</span>設定</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none" onchange="importFile(this)">
<script>
"use strict";
/* ========== 基本定義 ========== */
const LS_KEY='nekoMizu.v1', UI_KEY='nekoMizu.ui';
const T={
  mix:{l:'食事に混ぜた水',ic:'🥣'}, bowl:{l:'器から飲んだ水',ic:'💧'}, food:{l:'食事',ic:'🍚'},
  pee:{l:'小',ic:'🟡'}, poop:{l:'大',ic:'🟤'}, vomit:{l:'嘔吐',ic:'🤮'},
  weight:{l:'体重',ic:'⚖️'}, med:{l:'投薬・通院',ic:'💊'}, memo:{l:'メモ',ic:'📝'}
};
const POOP_ST=[[1,'コロコロ(硬い)'],[2,'やや硬い'],[3,'普通'],[4,'軟らかい'],[5,'水様(下痢)']];
const SIZE=[[1,'少'],[2,'普通'],[3,'多']];
const PEE_SIZE=[[1,'小さい塊'],[2,'普通'],[3,'大きい塊']];
const PEE_COL=[['普通','普通'],['薄い','薄い'],['濃い','濃い'],['赤・ピンク','赤・ピンク']];
const POOP_COL=[['普通','普通(茶)'],['黒っぽい','黒っぽい'],['白っぽい','白っぽい'],['赤っぽい','赤っぽい'],['その他','その他']];
const VOMIT=[['毛玉','毛玉'],['未消化フード','未消化フード'],['液体・泡','液体・泡'],['その他','その他']];
const MED=[['投薬','投薬'],['通院','通院'],['その他','その他']];
const WD='日月火水木金土';

let S={cats:[],foods:[],settings:{inclFood:true,peeH:24,poopD:3},recs:[]};
let UI={tab:'rec',cat:null,day:null,calYM:null,gDays:7,repFrom:null,repTo:null};
let COL=null, wq=Promise.resolve(), dirty=new Set(), syncMsg='この端末のブラウザ内';
const BK_KEY='nekoMizu.lastBackup', BK_DAYS=7;
const FRAMED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();

/* ========== ユーティリティ ========== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const nowT=()=>{const d=new Date();return dstr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());};
const today=()=>dstr(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const parseT=t=>{const [a,b]=t.split('T');const d=parseD(a);const [h,mi]=(b||'00:00').split(':').map(Number);d.setHours(h,mi);return d;};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);};
const fmtDay=s=>{const d=parseD(s);return (d.getMonth()+1)+'月'+d.getDate()+'日('+WD[d.getDay()]+')';};
const tmOf=r=>r.nt?'時刻なし':r.t.slice(11,16);
const effT=r=>{const d=parseT(r.t),n=new Date();return d>n?n:d;};
const r1=x=>Math.round(x*10)/10;
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
function toast(msg,actLabel,act){
  const t=$('toast');t.innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+(actLabel?'<button id="tAct">'+esc(actLabel)+'</button>':'')+'</div>';
  if(actLabel)$('tAct').onclick=()=>{t.innerHTML='';act();};
  clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',actLabel?5000:2500);
}

/* ========== 保存（端末＋クラウド） ========== */
/* 保存先：IndexedDB（大容量）。使えない環境では localStorage に保存 */
let IDBP=null, saveWarned=false;
function idb(){
  if(IDBP)return IDBP;
  IDBP=new Promise((res)=>{
    try{const q=indexedDB.open('nekoMizu',1);
      q.onupgradeneeded=()=>q.result.createObjectStore('kv');
      q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);q.onblocked=()=>res(null);
    }catch(e){res(null);}
  });
  return IDBP;
}
function idbGet(k){return idb().then(db=>db?new Promise(res=>{try{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined);}catch(e){res(undefined);}}):undefined);}
function idbPut(k,v){return idb().then(db=>db?new Promise(res=>{try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=t.onabort=()=>res(false);}catch(e){res(false);}}):false);}
let saveChain=Promise.resolve();
function saveLocal(){
  const snap=JSON.stringify(S);
  saveChain=saveChain.then(async()=>{
    const ok=await idbPut('state',snap);
    if(ok){try{localStorage.removeItem(LS_KEY);}catch(e){}return;}
    try{localStorage.setItem(LS_KEY,snap);}
    catch(e){if(!saveWarned){saveWarned=true;toast('⚠ 端末の保存容量が足りず保存できませんでした。すぐにバックアップを保存してください');}}
  });
}
function saveUI(){try{localStorage.setItem(UI_KEY,JSON.stringify({cat:UI.cat,gDays:UI.gDays}));}catch(e){}}
async function loadLocal(){
  let raw=await idbGet('state');
  if(!raw){try{raw=localStorage.getItem(LS_KEY);}catch(e){}}
  try{const j=JSON.parse(raw||'null');if(j&&j.cats)S=normalize(j);}catch(e){}
  try{const u=JSON.parse(localStorage.getItem(UI_KEY)||'null');if(u){UI.cat=u.cat;UI.gDays=u.gDays||7;}}catch(e){}
}
function normalize(j){
  return {cats:j.cats||[],foods:j.foods||[],settings:Object.assign({inclFood:true,peeH:24,poopD:3},j.settings||{}),recs:j.recs||[]};
}
const mkey=r=>'m-'+r.cat+'-'+r.t.slice(0,7);
function markRec(r){dirty.add(mkey(r));}
function markMeta(){dirty.add('meta');}
function commit(){saveLocal();render();flush();}
function flush(){
  if(!COL){dirty.clear();return;}
  const keys=[...dirty];dirty.clear();
  keys.forEach(k=>{wq=wq.then(()=>writeKey(k)).catch(dbErr);});
}
function writeKey(k){
  if(k==='meta')return COL.doc('meta').set({cats:S.cats,foods:S.foods,settings:S.settings,v:1});
  const m=k.match(/^m-(.+)-(\d{4}-\d{2})$/);if(!m)return;
  const items=S.recs.filter(r=>r.cat===m[1]&&r.t.slice(0,7)===m[2]);
  return items.length?COL.doc(k).set({items}):COL.doc(k).delete();
}
function dbErr(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')toast('クラウドの保存容量がいっぱいです。端末には保存されています');
  else if(c==='revoked'||c==='not_granted'||c==='invalid_argument'){COL=null;syncMsg='端末内に保存';if(UI.tab==='set')render();}
  else toast('クラウド保存に失敗しました（端末には保存済み）');
}
function cap(name){
  if(!FRAMED)return Promise.resolve(null);
  return new Promise(res=>{let n=0;(function t(){
    if(window.claude&&typeof window.claude.use==='function'){window.claude.use(name).then(res,()=>res(null));}
    else if(n++<15)setTimeout(t,200);else res(null);
  })();});
}
function fromDocs(docs){
  const out={cats:[],foods:[],settings:{},recs:[]};let has=false;
  docs.forEach(d=>{const b=JSON.parse(JSON.stringify(d.data()||{}));has=true;
    if(d.id==='meta'){out.cats=b.cats||[];out.foods=b.foods||[];out.settings=b.settings||{};}
    else if(d.id.startsWith('m-')&&Array.isArray(b.items))out.recs.push(...b.items);
  });
  return has?normalize(out):null;
}
async function initCloud(){
  const db=await cap('db'), user=await cap('user');
  if(!db||!user)return;
  let id=null;try{id=await user.id();}catch(e){}
  if(!id)return;
  let col;try{col=db.collection('data/users/'+id);}catch(e){return;}
  syncMsg='クラウドに接続中…';
  const timer=setTimeout(()=>{if(!COL){syncMsg='クラウドに接続できません（端末内に保存）';if(UI.tab==='set')render();}},10000);
  let first=true;
  col.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const remote=fromDocs(snap.docs);
    if(snap.metadata.fromCache){ if(remote&&first){S=remote;saveLocal();render();} return; }
    clearTimeout(timer);
    if(first){first=false;COL=col;syncMsg='クラウドに自動保存（このアカウントの他の端末と共有）';
      if(!remote){ if(S.cats.length||S.recs.length){markMeta();S.recs.forEach(markRec);flush();} if(UI.tab==='set')render(); return; }
    }
    if(remote){S=remote;saveLocal();render();}
  },e=>{clearTimeout(timer);COL=null;syncMsg='端末内に保存';if(UI.tab==='set')render();});
}

/* ========== 計算 ========== */
function cat(){return S.cats.find(c=>c.id===UI.cat)||S.cats[0]||null;}
function foodOf(id){return S.foods.find(f=>f.id===id);}
const bowlMl=r=>Math.max(0,num(r.put)-num(r.left)-num(r.evap));
const eaten=r=>Math.max(0,num(r.given)-num(r.left));
const moist=r=>eaten(r)*num(r.pct)/100;
let IDX=null;
function index(){
  if(IDX)return IDX;
  IDX={};S.recs.forEach(r=>{(IDX[r.cat]=IDX[r.cat]||{});const d=r.t.slice(0,10);(IDX[r.cat][d]=IDX[r.cat][d]||[]).push(r);});
  Object.values(IDX).forEach(m=>Object.values(m).forEach(a=>a.sort((x,y)=>x.t<y.t?-1:1)));
  return IDX;
}
function dayRecs(cid,d){const m=index()[cid];return (m&&m[d])||[];}
function weightOn(c,d){
  const ws=S.recs.filter(r=>r.cat===c.id&&r.type==='weight'&&r.t.slice(0,10)<=d).sort((a,b)=>a.t<b.t?-1:1);
  return ws.length?num(ws[ws.length-1].kg):num(c.weight);
}
function stats(c,d){
  const rs=dayRecs(c.id,d);
  const s={mix:0,bowl:0,food:0,dry:0,wet:0,pee:0,poop:0,vomit:0,poopSt:[],flags:false,weight:null,med:0,memo:0,hasWater:false,n:rs.length};
  rs.forEach(r=>{
    if(r.type==='mix'){s.mix+=num(r.ml);s.hasWater=true;}
    else if(r.type==='bowl'){s.bowl+=bowlMl(r);s.hasWater=true;}
    else if(r.type==='food'){s.food+=moist(r);if(r.kind==='dry')s.dry+=eaten(r);else s.wet+=eaten(r);if(moist(r)>0)s.hasWater=true;}
    else if(r.type==='pee'){s.pee++;if(r.blood||r.color==='赤・ピンク')s.flags=true;}
    else if(r.type==='poop'){s.poop++;if(num(r.st))s.poopSt.push(num(r.st));if(r.blood||r.mucus||r.foreign)s.flags=true;}
    else if(r.type==='vomit')s.vomit++;
    else if(r.type==='weight')s.weight=num(r.kg);
    else if(r.type==='med')s.med++;
    if(r.memo)s.memo++;
  });
  s.total=s.mix+s.bowl+(S.settings.inclFood?s.food:0);
  const w=weightOn(c,d);s.w=w;s.perKg=w>0?s.total/w:null;
  s.target=w>0&&num(c.target)>0?w*num(c.target):null;
  return s;
}
function alerts(c){
  const out=[], now=new Date(), rs=S.recs.filter(r=>r.cat===c.id);
  const last=t=>rs.filter(r=>r.type===t).map(effT).sort((a,b)=>a-b).pop();
  const lp=last('pee');
  if(lp){const h=(now-lp)/36e5;if(h>=num(S.settings.peeH))out.push('おしっこの記録が '+Math.floor(h)+' 時間ありません');}
  const lo=last('poop');
  if(lo){const dd=(now-lo)/864e5;if(dd>=num(S.settings.poopD))out.push('うんちの記録が '+Math.floor(dd)+' 日ありません');}
  const y=addDays(today(),-1), sy=stats(c,y);
  if(sy.hasWater){
    const prev=[];for(let i=2;i<=8;i++){const s=stats(c,addDays(today(),-i));if(s.hasWater)prev.push(s.total);}
    if(prev.length>=3){const avg=prev.reduce((a,b)=>a+b,0)/prev.length;
      if(avg>0&&sy.total>=avg*1.5)out.push('昨日の水分量（'+Math.round(sy.total)+'ml）が直近平均（'+Math.round(avg)+'ml）より大きく増えています');
      if(avg>0&&sy.total<=avg*0.5)out.push('昨日の水分量（'+Math.round(sy.total)+'ml）が直近平均（'+Math.round(avg)+'ml）より大きく減っています');}
  }
  const in24=r=>(now-effT(r))<=864e5;
  const vom=rs.filter(r=>r.type==='vomit'&&in24(r)).length;if(vom>=2)out.push('24時間以内に嘔吐が '+vom+' 回あります');
  if(rs.some(r=>in24(r)&&r.type==='poop'&&num(r.st)===5))out.push('24時間以内に水様便の記録があります');
  if(rs.some(r=>(now-effT(r))<=2*864e5&&((r.type==='pee'&&(r.blood||r.color==='赤・ピンク'))||(r.type==='poop'&&(r.blood||r.color==='赤っぽい'||r.color==='黒っぽい')))))out.push('48時間以内に血が混じった・色の異常の記録があります');
  const ws=rs.filter(r=>r.type==='weight').sort((a,b)=>a.t<b.t?-1:1);
  if(ws.length>=2){const L=ws[ws.length-1];const lim=addDays(L.t.slice(0,10),-30);const base=ws.find(r=>r.t.slice(0,10)>=lim&&r!==L);
    if(base&&num(base.kg)>0){const ch=(num(L.kg)-num(base.kg))/num(base.kg);if(Math.abs(ch)>=0.05)out.push('体重が30日以内に '+(ch>0?'+':'')+r1(ch*100)+'% 変化しています（'+base.kg+'→'+L.kg+'kg）');}}
  return out;
}

function lbl(arr,v){const x=arr.find(a=>String(a[0])===String(v));return x?x[1]:'';}
function recLine(r){
  switch(r.type){
    case 'mix':return num(r.ml)+' ml';
    case 'bowl':return bowlMl(r)+' ml（入れた'+num(r.put)+' − 残り'+num(r.left)+(num(r.evap)?' − 蒸発'+num(r.evap):'')+'）';
    case 'food':return (r.fname||'')+' '+r1(eaten(r))+' g 食べた（水分 約'+Math.round(moist(r))+' ml）';
    case 'pee':return [r.size?'量:'+lbl(PEE_SIZE,r.size):'',r.color?'色:'+r.color:''].filter(Boolean).join(' ')||'（詳細未記入）';
    case 'poop':return [r.st?lbl(POOP_ST,r.st):'',r.size?'量:'+lbl(SIZE,r.size):'',r.color?'色:'+r.color:''].filter(Boolean).join(' ')||'（詳細未記入）';

/* ========== グラフ ========== */
function rangeDays(n,end){const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(end,-i));return a;}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function shortD(d){const x=parseD(d);return (x.getMonth()+1)+'/'+x.getDate();}
function chart(days,series,line,target,opt){
  opt=opt||{};const W=360,H=210,L=36,R=8,Tp=10,B=26,n=days.length,pw=W-L-R,ph=H-Tp-B;
  const sums=days.map((_,i)=>series.reduce((a,s)=>a+(s.v[i]||0),0));
  let mx=Math.max(1,...sums,...(line?line.v.filter(v=>v!=null):[]),...(target?target.filter(v=>v!=null):[]));
  const st=niceStep(mx/4);mx=Math.ceil(mx*1.05/st)*st;
  const y=v=>Tp+ph-(v/mx)*ph, bw=pw/n;
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  for(let v=0;v<=mx+1e-9;v+=st){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+(Math.round(v*10)/10)+'</text>';}
  days.forEach((d,i)=>{let acc=0;const x=L+i*bw+bw*0.15,w=Math.max(1,bw*0.7);
    series.forEach(s=>{const v=s.v[i]||0;if(v>0){g+='<rect x="'+x.toFixed(1)+'" y="'+y(acc+v).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(y(acc)-y(acc+v)).toFixed(1)+'" style="fill:'+s.c+'"/>';}acc+=v;});
  });
  if(target){let p='';target.forEach((v,i)=>{if(v!=null)p+=(p?' L':'M')+(L+i*bw+bw/2).toFixed(1)+' '+y(v).toFixed(1);});if(p)g+='<path d="'+p+'" fill="none" style="stroke:var(--ok)" stroke-width="1.5" stroke-dasharray="4 3"/>';}
  if(line){let p='',dots='';line.v.forEach((v,i)=>{if(v==null)return;const cx=(L+i*bw+bw/2).toFixed(1),cy=y(v).toFixed(1);p+=(p?' L':'M')+cx+' '+cy;if(n<=31)dots+='<circle cx="'+cx+'" cy="'+cy+'" r="2.5" style="fill:'+line.c+'"/>';});g+='<path d="'+p+'" fill="none" style="stroke:'+line.c+'" stroke-width="2"/>'+dots;}
  const every=n<=7?1:n<=31?5:15;
  days.forEach((d,i)=>{if((n-1-i)%every===0)g+='<text x="'+(L+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+shortD(d)+'</text>';});
  if(opt.unit)g+='<text x="2" y="9">'+opt.unit+'</text>';
  return g+'</svg>';
}
function vGraph(){

    days.slice().reverse().map((d,i)=>{const s=ss[n-1-i];return s.hasWater?'<tr><td>'+shortD(d)+'('+WD[parseD(d).getDay()]+')</td><td>'+Math.round(s.mix)+'</td><td>'+Math.round(s.bowl)+'</td><td>'+Math.round(s.food)+'</td><td><b>'+Math.round(s.total)+'</b></td><td>'+(s.perKg!=null?r1(s.perKg):'—')+'</td></tr>':'';}).join('')+'</table></div></div>';
  h+='<div class="card"><h2>食事量（食べた量）</h2>'+chart(days,[{c:'var(--dry)',v:ss.map(s=>s.dry)},{c:'var(--wet)',v:ss.map(s=>s.wet)}],null,null,{unit:'g'})+
    '<div class="legend"><span><i class="dot" style="background:var(--dry)"></i>ドライ</span><span><i class="dot" style="background:var(--wet)"></i>ウェット</span></div></div>';
  h+='<div class="card"><h2>排泄回数</h2>'+chart(days,[{c:'#d9b43a',v:ss.map(s=>s.pee)},{c:'#8a5a3b',v:ss.map(s=>s.poop)}],null,null,{unit:'回'})+
    '<div class="legend"><span><i class="dot" style="background:#d9b43a"></i>小</span><span><i class="dot" style="background:#8a5a3b"></i>大</span>（積み上げ）</div></div>';
  const wv=ss.map(s=>s.weight);

  return h;
}
function wchart(days,vals){
  const W=360,H=170,L=36,R=8,Tp=10,B=26,n=days.length,pw=W-L-R,ph=H-Tp-B;
  const vs=vals.filter(v=>v!=null);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<0.4){const m=(hi+lo)/2;lo=m-0.2;hi=m+0.2;}
  const pd=(hi-lo)*0.15;lo-=pd;hi+=pd;const y=v=>Tp+ph-(v-lo)/(hi-lo)*ph,bw=pw/n;
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" style="stroke:var(--line)"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v.toFixed(2)+'</text>';}
  let p='',dots='';vals.forEach((v,i)=>{if(v==null)return;const cx=(L+i*bw+bw/2).toFixed(1),cy=y(v).toFixed(1);p+=(p?' L':'M')+cx+' '+cy;dots+='<circle cx="'+cx+'" cy="'+cy+'" r="3" style="fill:var(--acc)"/>';});
  g+='<path d="'+p+'" fill="none" style="stroke:var(--acc)" stroke-width="2"/>'+dots;
  const every=n<=7?1:n<=31?5:15;days.forEach((d,i)=>{if((n-1-i)%every===0)g+='<text x="'+(L+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+shortD(d)+'</text>';});
  return g+'<text x="2" y="9">kg</text></svg>';
}

  h+='<div class="sub" style="margin-top:8px">日付をタップすると、その日の記録画面に移動します。</div>';
  return h;
}
function poopDot(a){if(!a.length)return '';const w=Math.max(...a.map(s=>Math.abs(s-3)));const col=w===0?'#3c9a5f':w===1?'#d39b2a':'#c0392b';return ' <i class="dot" style="background:'+col+';width:8px;height:8px"></i>';}

  const c=S.cats.find(x=>x.id===id);
  askConfirm('「'+c.name+'」とその記録をすべて削除しますか？元に戻せません。',()=>{
    S.recs.filter(r=>r.cat===id).forEach(markRec);S.recs=S.recs.filter(r=>r.cat!==id);S.cats=S.cats.filter(x=>x.id!==id);markMeta();closeModal();commit();toast('削除しました');});
}
function editFood(id){
  const f=id?foodOf(id):{name:'',kind:'dry',pct:10};
  showModal('<h3>'+(id?'フードの編集':'フードの追加')+'</h3><div class="f"><label>名前</label><input type="text" id="fd_n" value="'+esc(f.name)+'" placeholder="例：○○ 成猫用"></div>'+
    '<div class="f"><label>種類</label>'+seg('fkind',[['dry','ドライ'],['wet','ウェット']],f.kind).replace('class="seg"','class="seg" data-req="1"')+'</div>'+
    '<div class="f"><label>水分（%）</label><input type="number" id="fd_p" inputmode="decimal" step="0.1" value="'+esc(f.pct)+'"></div>'+
    '<div class="sub" style="margin-bottom:12px">変更しても、過去の記録の水分計算はそのときの値のままです。</div>'+
    '<div class="row"><button class="btn pri" style="flex:1" onclick="saveFood(\''+(id||'')+'\')">保存</button><button class="btn" onclick="closeModal()">キャンセル</button>'+(id&&S.foods.length>1?'<button class="btn warn" onclick="delFood(\''+id+'\')">削除</button>':'')+'</div>');
}
function saveFood(id){
  const n=$('fd_n').value.trim();if(!n)return toast('名前を入れてください');
  const v={name:n,kind:segVal('fkind')||'dry',pct:num($('fd_p').value)};
  if(id)Object.assign(foodOf(id),v);else S.foods.push(Object.assign({id:uid()},v));
  markMeta();closeModal();commit();
}
function delFood(id){askConfirm('このフードを一覧から削除しますか？（過去の記録は残ります）',()=>{S.foods=S.foods.filter(f=>f.id!==id);markMeta();closeModal();commit();});}

/* ========== 書き出し・読み込み ========== */
async function saveFile(name,text,mime){
  const dl=await cap('downloads');
  if(dl){try{await dl.save({filename:name,data:text});toast('保存しました');return true;}catch(e){if(e&&e.code==='declined')toast('保存をキャンセルしました');else if(e&&e.code==='rate_limited')toast('少し待ってからもう一度押してください');else fallbackText(name,text);}return false;}
  const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if(isMobile&&navigator.canShare){
    try{const file=new File([text],name,{type:mime});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast('保存しました');return true;}
    }catch(e){if(e&&e.name==='AbortError'){toast('キャンセルしました');return false;}}
  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('保存しました');return true;}
  catch(e){fallbackText(name,text);return false;}
}
function fallbackText(name,text){showModal('<h3>'+esc(name)+'</h3><div class="sub">ファイル保存ができない環境です。下の内容をコピーして保存してください。</div><textarea style="width:100%;height:50vh" readonly>'+esc(text)+'</textarea><button class="btn" onclick="closeModal()">閉じる</button>');}
async function exportJson(){const ok=await saveFile('neko-backup-'+today()+'.json',JSON.stringify({app:'nekoMizu',v:1,exported:nowT(),cats:S.cats,foods:S.foods,settings:S.settings,recs:S.recs}),'application/json');if(ok){try{localStorage.setItem(BK_KEY,today());}catch(e){}render();}}
function exportCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['猫','日時','種類','水分ml','食べた量g','体重kg','詳細','メモ']];
  S.recs.slice().sort((a,b)=>a.t<b.t?-1:1).forEach(r=>{const c=S.cats.find(x=>x.id===r.cat);
    const ml=r.type==='mix'?num(r.ml):r.type==='bowl'?bowlMl(r):r.type==='food'?Math.round(moist(r)):'';
    rows.push([c?c.name:'',r.t.slice(0,10)+(r.nt?'':' '+r.t.slice(11,16)),T[r.type].l,ml,r.type==='food'?r1(eaten(r)):'',r.type==='weight'?r.kg:'',recLine(r)+' '+recTags(r).replace(/<[^>]+>/g,' ').trim(),r.memo||'']);});
  saveFile('neko-records-'+today()+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
}
function importFile(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const j=JSON.parse(rd.result);if(!j||!Array.isArray(j.recs)||!Array.isArray(j.cats))throw 0;
    const mg=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));b.forEach(x=>{if(x&&x.id)m.set(x.id,x);});return [...m.values()];};
    S.cats=mg(S.cats,j.cats);S.foods=mg(S.foods,j.foods||[]);
    const valid=j.recs.filter(r=>r&&r.id&&r.cat&&typeof r.t==='string'&&T[r.type]);
    S.recs=mg(S.recs,valid);if(j.settings)S.settings=Object.assign(S.settings,j.settings);
    markMeta();S.recs.forEach(markRec);commit();toast(valid.length+' 件の記録を読み込みました');
  }catch(e){toast('読み込めませんでした（このアプリのバックアップファイルか確認してください）');}};
  rd.readAsText(f);
}

loadLocal().then(()=>{render();initCloud();});
if(!FRAMED){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
